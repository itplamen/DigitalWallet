spring.application.name=notification-service
server.port=${SERVER_PORT:8084}

spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/notificationdb}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:notification_user}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:secret}
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

spring.flyway.enabled=true
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/notificationdb}
spring.flyway.user=${SPRING_FLYWAY_USER:notification_user}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:secret}
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

notification.email.smtp-enabled=${NOTIFICATION_EMAIL_SMTP_ENABLED:false}
notification.email.from=${NOTIFICATION_EMAIL_FROM:no-reply@digitalwallet.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
