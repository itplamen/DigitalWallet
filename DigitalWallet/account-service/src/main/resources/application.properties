spring.application.name=account-service
server.port=${SERVER_PORT:8080}

spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/accountdb}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:account_user}
spring.r2dbc.pool.initial-size=2
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:secret}
spring.r2dbc.pool.max-size=20

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=account-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.flyway.enabled=true
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/accountdb}
spring.flyway.user=${SPRING_FLYWAY_USER:account_user}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:secret}
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
