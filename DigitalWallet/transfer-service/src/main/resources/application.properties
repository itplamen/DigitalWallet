server.port=8081

spring.application.name=transfer-service

spring.datasource.url=jdbc:postgresql://localhost:5432/transferdb
spring.datasource.username=admin
spring.datasource.password=secret

spring.r2dbc.url=r2dbc:postgresql://localhost:5432/transferdb
spring.r2dbc.username=admin
spring.r2dbc.password=secret
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=transfer-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5432/transferdb
spring.flyway.user=admin
spring.flyway.password=secret
spring.flyway.locations=classpath:db/migration