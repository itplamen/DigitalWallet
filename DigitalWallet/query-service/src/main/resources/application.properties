spring.application.name=query-service
server.port=${SERVER_PORT:8085}

spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/querydb}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:query_user}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:query_local_password}
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

spring.flyway.enabled=true
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5432/querydb}
spring.flyway.user=${SPRING_FLYWAY_USER:query_user}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:query_local_password}
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=query-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
