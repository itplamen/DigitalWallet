spring.application.name=bank-mock-service
server.port=${SERVER_PORT:8086}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

bank-mock.webhook.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8083}
bank-mock.webhook.secret=${PAYMENT_WEBHOOK_SECRET:local-webhook-secret}
bank-mock.webhook.delay=${BANK_MOCK_WEBHOOK_DELAY:2s}
bank-mock.payout.max-amount=${BANK_MOCK_PAYOUT_MAX_AMOUNT:1000}
